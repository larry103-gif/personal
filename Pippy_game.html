<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>小豬溫馨小屋 &amp; 遊戲廳 (Piggy Cozy Home &amp; Arcade)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-outer: #f6dfe3;
      --sky-top: #ffeef2;
      --sky-bottom: #fff8fa;
      --pig-pink: #FADADD;
      --pig-outline: #D89A9E;
      --pig-dark: #6E4E4A;
      --accent-berry: #f07b93;
      --accent-gold: #ffb84d;
      --cream-bg: #fffaf5;
      --card-bg: #ffffff;
      --shadow-soft: 0 10px 25px rgba(216, 154, 158, 0.25);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: 'Zen Maru Gothic', 'Noto Sans TC', 'Fredoka', sans-serif;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 60%, var(--bg-outer) 100%);
      color: var(--pig-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--cream-bg);
      border: 3px solid var(--pig-outline);
      border-radius: 28px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }

    header {
      background: var(--pig-pink);
      padding: 16px 20px;
      border-bottom: 2px dashed var(--pig-outline);
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--pig-dark);
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 12px 16px 0;
    }

    .tab-btn {
      padding: 10px;
      border: 2px solid var(--pig-outline);
      border-radius: 16px;
      background: var(--card-bg);
      color: var(--pig-dark);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent-berry);
      color: #ffffff;
      border-color: var(--accent-berry);
    }

    .tab-btn:active {
      transform: scale(0.97);
    }

    .panel {
      display: none;
      padding: 16px 20px 24px;
    }

    .panel.active {
      display: block;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: var(--card-bg);
      border: 2px solid var(--pig-outline);
      border-radius: 18px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .pig-stage {
      background: var(--card-bg);
      border: 2px solid var(--pig-outline);
      border-radius: 22px;
      padding: 24px 16px;
      text-align: center;
      margin-bottom: 16px;
    }

    .pig-avatar {
      font-size: 4.5rem;
      line-height: 1.2;
      cursor: pointer;
      display: inline-block;
      transition: transform 0.2s ease;
    }

    .pig-avatar:hover {
      transform: scale(1.08);
    }

    .pig-speech {
      margin-top: 10px;
      font-weight: 700;
      color: var(--pig-dark);
      min-height: 1.5em;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      border-radius: 16px;
      padding: 10px 16px;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--accent-berry);
      color: #ffffff;
    }

    .btn-gold {
      background: var(--accent-gold);
      color: var(--pig-dark);
    }

    .arcade-box {
      background: var(--card-bg);
      border: 2px solid var(--pig-outline);
      border-radius: 22px;
      padding: 20px;
      text-align: center;
    }

    .score-board {
      font-size: 1.1rem;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .berry-target {
      font-size: 3.2rem;
      margin: 12px auto 18px;
      width: 96px;
      height: 96px;
      line-height: 96px;
      border-radius: 50%;
      background: var(--sky-top);
      border: 2px dashed var(--accent-berry);
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .berry-target:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🐷 小豬溫馨小屋 &amp; 遊戲廳</h1>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="home">🏠 溫馨小屋</button>
      <button class="tab-btn" data-tab="arcade">🕹️ 遊戲廳</button>
    </div>

    <section id="home" class="panel active">
      <div class="stats">
        <div>🍓 飽食度：<span id="hunger">80</span>%</div>
        <div>💖 心情：<span id="mood">85</span>%</div>
        <div>🪙 金幣：<span id="coins">10</span></div>
      </div>

      <div class="pig-stage">
        <div id="pigAvatar" class="pig-avatar" title="摸摸小豬">🐷</div>
        <div id="pigSpeech" class="pig-speech">呼嚕～今天想吃草莓還是玩遊戲呢？</div>
      </div>

      <div class="actions">
        <button id="feedBtn" class="btn btn-primary">🍓 餵食草莓 (-10 飽食需 5 金幣)</button>
        <button id="petBtn" class="btn btn-gold">🫧 摸摸頭 (+心情)</button>
      </div>
    </section>

    <section id="arcade" class="panel">
      <div class="arcade-box">
        <div class="score-board">🍓 搶莓大作戰分數：<span id="score">0</span></div>
        <p>快點擊莓果賺取金幣吧！每次點擊獲得 +2 金幣</p>
        <div id="berryTarget" class="berry-target">🍓</div>
        <button id="resetGameBtn" class="btn btn-primary">重新計分</button>
      </div>
    </section>
  </div>

  <script>
    let hunger = 80;
    let mood = 85;
    let coins = 10;
    let score = 0;

    const hungerEl = document.getElementById('hunger');
    const moodEl = document.getElementById('mood');
    const coinsEl = document.getElementById('coins');
    const pigAvatarEl = document.getElementById('pigAvatar');
    const pigSpeechEl = document.getElementById('pigSpeech');
    const scoreEl = document.getElementById('score');

    function updateStats() {
      hunger = Math.max(0, Math.min(100, hunger));
      mood = Math.max(0, Math.min(100, mood));
      hungerEl.textContent = hunger;
      moodEl.textContent = mood;
      coinsEl.textContent = coins;
    }

    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach((p) => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    document.getElementById('feedBtn').addEventListener('click', () => {
      if (coins < 5) {
        pigSpeechEl.textContent = '金幣不夠啦！去「遊戲廳」點莓果賺金幣吧～';
        return;
      }
      coins -= 5;
      hunger += 15;
      mood += 5;
      pigAvatarEl.textContent = '🐽';
      pigSpeechEl.textContent = '哇～香甜的草莓！謝謝你！';
      updateStats();
    });

    function petPig() {
      mood += 10;
      pigAvatarEl.textContent = '🥰';
      pigSpeechEl.textContent = '好舒服呀～呼嚕呼嚕！';
      updateStats();
    }

    document.getElementById('petBtn').addEventListener('click', petPig);
    pigAvatarEl.addEventListener('click', petPig);

    document.getElementById('berryTarget').addEventListener('click', () => {
      score += 1;
      coins += 2;
      scoreEl.textContent = score;
      updateStats();
    });

    document.getElementById('resetGameBtn').addEventListener('click', () => {
      score = 0;
      scoreEl.textContent = score;
    });

    updateStats();
  </script>
</body>
</html>
