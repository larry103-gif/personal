<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數字全方位特性分析報告工具</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            color: #2c3e50;
            border-bottom: 3px solid #3498db;
            padding-bottom: 12px;
            margin-top: 0;
            text-align: center;
        }
        .input-group {
            margin: 25px 0;
            display: flex;
            gap: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            box-sizing: border-box;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            outline: none;
        }
        button {
            background-color: #3498db;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            font-weight: bold;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #2c3e50;
            color: #ecf0f1;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 15px;
            display: none;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 數字超級全方位特性分析報告</h1>
    
    <div class="input-group">
        <input type="text" id="numberInput" placeholder="請輸入任意整數 (支援正負數與超大數字)...">
        <button onclick="startAnalysis()">開始分析數字</button>
    </div>
    
    <div id="result" class="result-box"></div>
</div>

<script>
    function bigAbs(v) { return v < 0n ? -v : v; }

    function bigPower(base, exp, mod) {
        let res = 1n;
        base = BigInt(base) % BigInt(mod);
        exp = BigInt(exp);
        let m = BigInt(mod);
        while (exp > 0n) {
            if (exp % 2n === 1n) res = (res * base) % m;
            base = (base * base) % m;
            exp /= 2n;
        }
        return res;
    }

    function bigGcd(a, b) {
        a = bigAbs(BigInt(a));
        b = bigAbs(BigInt(b));
        while (b !== 0n) {
            let t = b;
            b = a % b;
            a = t;
        }
        return a;
    }

    function bigIsqrt(value) {
        if (value < 0n) return null;
        if (value < 2n) return value;
        let x0 = value / 2n;
        let x1 = (x0 + value / x0) / 2n;
        while (x1 < x0) {
            x0 = x1;
            x1 = (x0 + value / x0) / 2n;
        }
        return x0;
    }

    function miller_rabin(n) {
        n = BigInt(n);
        if (n < 2n) return false;
        const small_primes = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n, 41n, 43n, 47n];
        if (small_primes.includes(n)) return true;
        for (let p of small_primes) {
            if (n % p === 0n) return false;
        }

        let d = n - 1n;
        let s = 0n;
        while (d % 2n === 0n) {
            d /= 2n;
            s++;
        }

        const bases = [2n, 3n, 5n, 7n, 11n, 13n, 17n, 19n, 23n, 29n, 31n, 37n];
        for (let a of bases) {
            if (n <= a) break;
            let x = bigPower(a, d, n);
            if (x === 1n || x === n - 1n) continue;
            let composite = true;
            for (let r = 0n; r < s - 1n; r++) {
                x = bigPower(x, 2n, n);
                if (x === n - 1n) {
                    composite = false;
                    break;
                }
            }
            if (composite) return false;
        }
        return true;
    }

    function pollard_rho_brent(n) {
        n = BigInt(n);
        if (n % 2n === 0n) return 2n;
        if (n % 3n === 0n) return 3n;
        if (n % 5n === 0n) return 5n;

        let y = BigInt(Math.floor(Math.random() * 999) + 1);
        let c = BigInt(Math.floor(Math.random() * 999) + 1);
        let m = BigInt(Math.floor(Math.random() * 999) + 1);
        let g = 1n, r = 1n, q = 1n;
        let ys = 0n, x = 0n;

        while (g === 1n) {
            x = y;
            for (let i = 0n; i < r; i++) {
                y = (bigPower(y, 2n, n) + c) % n;
            }
            let k = 0n;
            while (k < r && g === 1n) {
                ys = y;
                let limit = r - k < m ? r - k : m;
                for (let i = 0n; i < limit; i++) {
                    y = (bigPower(y, 2n, n) + c) % n;
                    let diff = x > y ? x - y : y - x;
                    q = (q * diff) % n;
                }
                g = bigGcd(q, n);
                k += m;
            }
            r *= 2n;
        }

        if (g === n) {
            while (true) {
                ys = (bigPower(ys, 2n, n) + c) % n;
                let diff = x > ys ? x - ys : ys - x;
                g = bigGcd(diff, n);
                if (g > 1n) break;
            }
        }
        return g;
    }

    function get_prime_factors(n) {
        let factors = [];
        function factorize(val) {
            if (val === 1n) return;
            if (miller_rabin(val)) {
                factors.push(val);
                return;
            }
            let p = pollard_rho_brent(val);
            factorize(p);
            factorize(val / p);
        }
        factorize(n);
        return factors.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
    }

    function get_all_divisors(countsMap) {
        let divs = [1n];
        for (let [pStr, e] of countsMap.entries()) {
            let p = BigInt(pStr);
            let new_divs = [];
            for (let d of divs) {
                for (let k = 1; k <= e; k++) {
                    new_divs.push(d * (p ** BigInt(k)));
                }
            }
            divs = divs.concat(new_divs);
        }
        return divs.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
    }

    function to_roman(n) {
        if (n < 1n || n > 3999n) return null;
        let num = Number(n);
        const vals =;
        const syms = ["M", "CM", "D", "CD", "C", "XC", "L", "XL", "X", "IX", "V", "IV", "I"];
        let roman = "";
        for (let i = 0; i < vals.length; i++) {
            while (num >= vals[i]) {
                roman += syms[i];
                num -= vals[i];
            }
        }
        return roman;
    }

    function is_happy_number(n) {
        let seen = new Set();
        let curr = BigInt(n);
        while (curr !== 1n && !seen.has(curr.toString())) {
            seen.add(curr.toString());
            let sum = 0n;
            let s = curr.toString();
            for (let i = 0; i < s.length; i++) {
                sum += BigInt(s[i]) ** 2n;
            }
            curr = sum;
        }
        return curr === 1n;
    }

    function collatz_steps(n) {
        if (n <= 0n) return null;
        let steps = 0;
        let curr = BigInt(n);
        while (curr > 1n && steps < 10000) {
            if (curr % 2n === 0n) {
                curr /= 2n;
            } else {
                curr = 3n * curr + 1n;
            }
            steps++;
        }
        return curr === 1n ? steps : "> 10000";
    }

    function startAnalysis() {
        const inputStr = document.getElementById('numberInput').value.trim();
        const resultBox = document.getElementById('result');
        
        if (!inputStr || isNaN(inputStr) || inputStr.includes('.')) {
            alert('請輸入有效的整數！');
            return;
        }

        resultBox.style.display = 'block';
        resultBox.innerHTML = '正在進行深度數學運算分析，請稍候...';

        setTimeout(() => {
            const num = BigInt(inputStr);
            const abs_num = bigAbs(num);
            
            let output = `============================================================\n`;
            output += ` 🔍 數字 【 ${num} 】 的超級全方位特性分析報告\n`;
            output += `============================================================\n`;

            output += `\n【 1. 符號與絕對值屬性 】\n`;
            let sign_str = num > 0n ? "正數 (Positive)" : (num < 0n ? "負數 (Negative)" : "零 (Zero)");
            output += `• 數值性質   : ${sign_str}\n`;
            output += `• 絕對值 |N| : ${abs_num}\n`;
            output += `• 相反數 -N  : ${-num}\n`;
            if (num !== 0n) {
                output += `• 倒數 1/N   : ${(1 / Number(num)).toFixed(8)} (即 1/${num})\n`;
            } else {
                output += `• 倒數 1/N   : 無意義（分母不能為 0）\n`;
            }

            output += `\n【 2. 位元與數位屬性 】\n`;
            let num_str = abs_num.toString();
            let digit_len = num_str.length;
            let parity = num % 2n === 0n ? "偶數 (Even)" : "奇數 (Odd)";
            let digit_sum = 0;
            for(let i=0; i<num_str.length; i++) digit_sum += parseInt(num_str[i]);
            
            let bit_len = abs_num.toString(2).length;
            if(abs_num === 0n) bit_len = 0;
            let bit_count = (abs_num.toString(2).match(/1/g) || []).length;

            output += `• 十進制位數 : ${digit_len} 位數\n`;
            output += `• 奇偶性     : ${parity}\n`;
            output += `• 各數位總和 : ${digit_sum}\n`;
            output += `• 二進制位長 : ${bit_len} bits\n`;
            output += `• 開啟位元數 : ${bit_count} 個 (1 的個數 / Hamming Weight)\n`;
