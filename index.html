<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個人專屬記帳系統</title>
  <!-- 載入 EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --income: #16a34a;
      --expense: #dc2626;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
    .container { width: 100%; max-width: 720px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04); margin-bottom: 20px; }
    h1, h2, h3 { margin-top: 0; }
    .hidden { display: none !important; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; outline: none; transition: border-color .15s; }
    input:focus, select:focus { border-color: var(--primary); }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; }
    button { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s; }
    button:hover { background: var(--primary-hover); }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    button.secondary { background: #e2e8f0; color: var(--text); }
    button.secondary:hover { background: #cbd5e1; }
    button.danger { background: #fee2e2; color: var(--expense); padding: 6px 10px; font-size: 13px; }
    button.danger:hover { background: #fecaca; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .tab-btn { background: transparent; color: var(--muted); padding: 8px 16px; }
    .tab-btn.active { background: var(--primary); color: #fff; }
    .msg { font-size: 13px; margin-top: 8px; padding: 8px 12px; border-radius: 6px; }
    .msg.info { background: #eff6ff; color: #1d4ed8; }
    .msg.error { background: #fef2f2; color: #dc2626; }
    .msg.success { background: #f0fdf4; color: #15803d; }

    /* 儀表板樣式 */
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-box { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; }
    .stat-label { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .stat-val { font-size: 20px; font-weight: 700; }
    .income-text { color: var(--income); }
    .expense-text { color: var(--expense); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.income { background: #dcfce7; color: var(--income); }
    .badge.expense { background: #fee2e2; color: var(--expense); }
    @media (max-width: 540px) {
      .summary { grid-template-columns: 1fr; }
      .row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- ==================== 登入 / 註冊區塊 ==================== -->
    <div id="auth-section" class="card">
      <h2 style="margin-bottom: 6px;">📒 個人專屬記帳系統</h2>
      <p style="color: var(--muted); font-size: 14px; margin-top: 0;">各帳號資料獨立儲存，新用戶需透過信箱驗證碼註冊</p>

      <div class="tabs">
        <button id="tab-login" class="tab-btn active" onclick="switchAuthTab('login')">登入帳號</button>
        <button id="tab-register" class="tab-btn" onclick="switchAuthTab('register')">信箱驗證註冊</button>
      </div>

      <!-- 登入表單 -->
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>電子信箱</label>
          <input type="email" id="login-email" placeholder="請輸入註冊的電子信箱" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label>登入密碼</label>
          <input type="password" id="login-password" placeholder="請輸入密碼" required autocomplete="current-password" />
        </div>
        <button type="submit" style="width: 100%;">登入記帳本</button>
        <div id="login-msg" class="msg hidden"></div>
      </form>

      <!-- 註冊表單 -->
      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>1. 電子信箱（作為您的專屬帳號）</label>
          <div class="row">
            <input type="email" id="reg-email" placeholder="請輸入您的電子信箱" required />
            <button type="button" id="send-code-btn" onclick="sendVerificationCode()" style="flex: 0 0 auto;">寄送驗證碼</button>
          </div>
          <div id="code-status" class="msg hidden"></div>
        </div>

        <div class="form-group">
          <label>2. 信箱 6 位數驗證碼</label>
          <input type="text" id="reg-code" placeholder="請輸入信箱收到的 6 位數驗證碼" maxlength="6" required />
        </div>

        <div class="form-group">
          <label>3. 設定顯示名稱</label>
          <input type="text" id="reg-name" placeholder="例如：王小明" required />
        </div>

        <div class="form-group">
          <label>4. 設定登入密碼</label>
          <input type="password" id="reg-password" placeholder="請設定密碼（至少 4 碼）" minlength="4" required />
        </div>

        <button type="submit" style="width: 100%;">完成驗證並註冊</button>
        <div id="reg-msg" class="msg hidden"></div>
      </form>
    </div>

    <!-- ==================== 記帳主畫面區塊 ==================== -->
    <div id="app-section" class="hidden">
      <div class="card">
        <div class="topbar">
          <div>
            <h2 style="margin: 0;" id="welcome-title">你好！</h2>
            <span style="font-size: 13px; color: var(--muted);" id="current-user-email"></span>
          </div>
          <button class="secondary" onclick="handleLogout()">登出</button>
        </div>

        <div class="summary">
          <div class="stat-box">
            <div class="stat-label">總收入</div>
            <div class="stat-val income-text" id="total-income">$0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">總支出</div>
            <div class="stat-val expense-text" id="total-expense">$0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">目前結餘</div>
            <div class="stat-val" id="total-balance">$0</div>
          </div>
        </div>

        <h3 style="font-size: 16px; margin-bottom: 12px;">新增收支紀錄</h3>
        <form onsubmit="addRecord(event)">
          <div class="row form-group">
            <div>
              <label>類型</label>
              <select id="rec-type">
                <option value="expense">支出</option>
                <option value="income">收入</option>
              </select>
            </div>
            <div>
              <label>分類</label>
              <select id="rec-category">
                <option value="餐飲">餐飲</option>
                <option value="交通">交通</option>
                <option value="購物">購物</option>
                <option value="娛樂">娛樂</option>
                <option value="居住/帳單">居住/帳單</option>
                <option value="薪資/獎金">薪資/獎金</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div>
              <label>日期</label>
              <input type="date" id="rec-date" required />
            </div>
          </div>
          <div class="row form-group">
            <div>
              <label>金額</label>
              <input type="number" id="rec-amount" placeholder="請輸入金額" min="1" step="1" required />
            </div>
            <div>
              <label>備註說明</label>
              <input type="text" id="rec-note" placeholder="例如：午餐便當、捷運儲值" />
            </div>
          </div>
          <button type="submit" style="width: 100%;">儲存紀錄</button>
        </form>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
          <h3 style="margin: 0; font-size: 16px;">歷史收支明細</h3>
          <button class="secondary" style="font-size: 13px; padding: 6px 12px;" onclick="exportCSV()">匯出 CSV</button>
        </div>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th>類型</th>
                <th>分類</th>
                <th>備註</th>
                <th>金額</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="record-list"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==================== EmailJS 真實金鑰設定 ====================
    const EMAILJS_PUBLIC_KEY  = "w944FFd1_403jmOVb";
    const EMAILJS_SERVICE_ID  = "service_idwnyff";
    const EMAILJS_TEMPLATE_ID = "template_pe4q7sr";

    emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

    // ==================== 狀態與儲存鍵值 ====================
    const USERS_KEY = "bookkeeping_users_v1";
    const SESSION_KEY = "bookkeeping_current_user_v1";
    let pendingVerification = { email: "", code: "", expiresAt: 0 };
    let countdownTimer = null;

    // 初始化日期與登入狀態
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("rec-date").value = new Date().toISOString().split("T")[0];
      const savedEmail = localStorage.getItem(SESSION_KEY);
      if (savedEmail) {
        const users = getUsers();
        if (users[savedEmail]) {
          enterApp(users[savedEmail]);
        }
      }
    });

    function getUsers() {
      try {
        return JSON.parse(localStorage.getItem(USERS_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveUsers(users) {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function showMsg(elId, text, type = "info") {
      const el = document.getElementById(elId);
      el.textContent = text;
      el.className = `msg ${type}`;
      el.classList.remove("hidden");
    }

    function switchAuthTab(tab) {
      const isLogin = tab === "login";
      document.getElementById("tab-login").classList.toggle("active", isLogin);
      document.getElementById("tab-register").classList.toggle("active", !isLogin);
      document.getElementById("login-form").classList.toggle("hidden", !isLogin);
      document.getElementById("register-form").classList.toggle("hidden", isLogin);
      document.getElementById("login-msg").classList.add("hidden");
      document.getElementById("reg-msg").classList.add("hidden");
    }

    // ==================== 寄送真實 6 位數驗證碼 ====================
    async function sendVerificationCode() {
      const email = document.getElementById("reg-email").value.trim().toLowerCase();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showMsg("code-status", "請先輸入有效的電子信箱格式。", "error");
        return;
      }

      const users = getUsers();
      if (users[email]) {
        showMsg("code-status", "此信箱已註冊過帳號，請直接切換至「登入帳號」。", "error");
        return;
      }

      const btn = document.getElementById("send-code-btn");
      btn.disabled = true;
      showMsg("code-status", "正在發送驗證碼至您的信箱，請稍候...", "info");

      const code = String(Math.floor(100000 + Math.random() * 900000));
      pendingVerification = {
        email,
        code,
        expiresAt: Date.now() + 5 * 60 * 1000 // 5 分鐘有效
      };

      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_email: email,
          passcode: code
        });

        showMsg("code-status", `驗證碼已寄出至 ${email}（5 分鐘內有效，若未看到請檢查垃圾信件匣）。`, "success");
        startCooldown(60);
      } catch (err) {
        console.error("EmailJS 發送失敗:", err);
        btn.disabled = false;
        showMsg("code-status", "驗證信發送失敗，請確認網路連線或稍後再試。", "error");
      }
    }

    function startCooldown(seconds) {
      const btn = document.getElementById("send-code-btn");
      let left = seconds;
      btn.disabled = true;
      btn.textContent = `重新寄送 (${left}s)`;
      clearInterval(countdownTimer);
      countdownTimer = setInterval(() => {
        left--;
        if (left <= 0) {
          clearInterval(countdownTimer);
          btn.disabled = false;
          btn.textContent = "寄送驗證碼";
        } else {
          btn.textContent = `重新寄送 (${left}s)`;
        }
      }, 1000);
    }

    // ==================== 註冊與登入處理 ====================
    function handleRegister(e) {
      e.preventDefault();
      const email = document.getElementById("reg-email").value.trim().toLowerCase();
      const code = document.getElementById("reg-code").value.trim();
      const name = document.getElementById("reg-name").value.trim();
      const password = document.getElementById("reg-password").value;

      if (!pendingVerification.code || pendingVerification.email !== email) {
        showMsg("reg-msg", "請先點擊「寄送驗證碼」取得此信箱的驗證碼。", "error");
        return;
      }
      if (Date.now() > pendingVerification.expiresAt) {
        showMsg("reg-msg", "驗證碼已過期，請重新寄送驗證碼。", "error");
        return;
      }
      if (code !== pendingVerification.code) {
        showMsg("reg-msg", "驗證碼輸入錯誤，請重新確認信件中的 6 位數字。", "error");
        return;
      }

      const users = getUsers();
      if (users[email]) {
        showMsg("reg-msg", "此信箱已註冊過帳號。", "error");
        return;
      }

      users[email] = { email, name, password };
      saveUsers(users);
      pendingVerification = { email: "", code: "", expiresAt: 0 };

      localStorage.setItem(SESSION_KEY, email);
      enterApp(users[email]);
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim().toLowerCase();
      const password = document.getElementById("login-password").value;
      const users = getUsers();

      if (!users[email] || users[email].password !== password) {
        showMsg("login-msg", "電子信箱或密碼錯誤，若尚未註冊請先完成信箱驗證註冊。", "error");
        return;
      }

      localStorage.setItem(SESSION_KEY, email);
      enterApp(users[email]);
    }

    function handleLogout() {
      localStorage.removeItem(SESSION_KEY);
      document.getElementById("app-section").classList.add("hidden");
      document.getElementById("auth-section").classList.remove("hidden");
      document.getElementById("login-password").value = "";
    }

    // ==================== 個人獨立記帳資料邏輯 ====================
    function getRecordKey(email) {
      return `bookkeeping_records_${email}`;
    }

    function getCurrentUser() {
      const email = localStorage.getItem(SESSION_KEY);
      return email ? getUsers()[email] : null;
    }

    function enterApp(user) {
      document.getElementById("auth-section").classList.add("hidden");
      document.getElementById("app-section").classList.remove("hidden");
      document.getElementById("welcome-title").textContent = `你好，${user.name}！`;
      document.getElementById("current-user-email").textContent = `專屬帳號：${user.email}`;
      renderRecords();
    }

    function getRecords() {
      const user = getCurrentUser();
      if (!user) return [];
      try {
        return JSON.parse(localStorage.getItem(getRecordKey(user.email))) || [];
      } catch {
        return [];
      }
    }

    function saveRecords(records) {
      const user = getCurrentUser();
      if (!user) return;
      localStorage.setItem(getRecordKey(user.email), JSON.stringify(records));
    }

    function addRecord(e) {
      e.preventDefault();
      const type = document.getElementById("rec-type").value;
      const category = document.getElementById("rec-category").value;
      const date = document.getElementById("rec-date").value;
      const amount = Number(document.getElementById("rec-amount").value);
      const note = document.getElementById("rec-note").value.trim() || "-";

      const records = getRecords();
      records.unshift({
        id: Date.now(),
        type,
        category,
        date,
        amount,
        note
      });
      saveRecords(records);

      document.getElementById("rec-amount").value = "";
      document.getElementById("rec-note").value = "";
      renderRecords();
    }

    function deleteRecord(id) {
      const records = getRecords().filter(r => r.id !== id);
      saveRecords(records);
      renderRecords();
    }

    function renderRecords() {
      const records = getRecords();
      let income = 0;
      let expense = 0;

      const tbody = document.getElementById("record-list");
      tbody.innerHTML = "";

      if (records.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--muted); padding:24px;">目前尚無記帳紀錄，快新增第一筆收支吧！</td></tr>`;
      } else {
        records.forEach(r => {
          if (r.type === "income") income += r.amount;
          else expense += r.amount;

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${r.date}</td>
            <td><span class="badge ${r.type}">${r.type === "income" ? "收入" : "支出"}</span></td>
            <td>${r.category}</td>
            <td>${escapeHTML(r.note)}</td>
            <td class="${r.type === "income" ? "income-text" : "expense-text"}" style="font-weight:600;">
              ${r.type === "income" ? "+" : "-"}$${r.amount.toLocaleString()}
            </td>
            <td><button class="danger" onclick="deleteRecord(${r.id})">刪除</button></td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById("total-income").textContent = `$${income.toLocaleString()}`;
      document.getElementById("total-expense").textContent = `$${expense.toLocaleString()}`;
      const bal = income - expense;
      const balEl = document.getElementById("total-balance");
      balEl.textContent = `${bal < 0 ? "-" : ""}$${Math.abs(bal).toLocaleString()}`;
      balEl.className = `stat-val ${bal >= 0 ? "income-text" : "expense-text"}`;
    }

    function exportCSV() {
      const user = getCurrentUser();
      const records = getRecords();
      if (!user || records.length === 0) {
        alert("目前沒有可匯出的紀錄。");
        return;
      }
      const rows = [["日期", "類型", "分類", "備註", "金額"]];
      records.forEach(r => {
        rows.push([
          r.date,
          r.type === "income" ? "收入" : "支出",
          r.category,
          `"${r.note.replace(/"/g, '""')}"`,
          r.type === "income" ? r.amount : -r.amount
        ]);
      });
      const csvContent = "\uFEFF" + rows.map(e => e.join(",")).join("\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `記帳明細_${user.name}_${new Date().toISOString().split("T")[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function escapeHTML(str) {
      return str.replace(/[&<>"']/g, m => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }
  </script>
</body>
</html>
